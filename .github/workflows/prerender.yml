name: Prerender
# Regenera el HTML de cada página cuando cambia el contenido (por ejemplo, al publicar desde admin.html).
on:
  push:
    branches: [main]
    paths: ["contenido.js", "js/app.js", "css/estilos.css", "tools/prerender.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tools/prerender.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sobre-mi.html proyectos.html habilidades.html experiencia.html contacto.html
          git diff --cached --quiet || (git commit -m "Actualiza HTML prerenderizado [skip ci]" && git push)
